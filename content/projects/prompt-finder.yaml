challenge: >
  Managing hundreds of ChatGPT prompts across multiple PDFs is a nightmare. Each prompt is buried in a document, categories are mixed together, and finding the right prompt for a task means scrolling through pages of unrelated content.

  The challenge was to extract, categorise, and surface all prompts in an instantly searchable interface that works offline with zero setup — no server, no build step, no dependencies.

approach: >
  I wrote a Python script to parse the source PDFs, extract each prompt with its metadata, and generate a self-contained HTML file with all data inlined as JSON. The result is two static HTML files that open in any browser.

  The main view features a search bar that filters prompts in real-time, category chips for browsing, and a results list with source attribution. The gallery view adds a grid layout with bookmarking (saved to localStorage) and a filtered category page system.

  Both include keyboard navigation, smooth scroll animations, and a dark theme that respects system preferences. The entire app loads instantly — no network requests, no loading spinners.

  For distribution, I generated a zip containing just the two HTML files — 462 KB compressed. Unzip and open in any browser.
